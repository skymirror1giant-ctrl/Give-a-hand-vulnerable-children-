<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Give A Hand</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; margin: 0; padding: 0; }
    .container { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #d00000; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: #d00000; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #a00000; }
    a { color: #d00000; text-decoration: none; }
    .note { font-size: 13px; color: #555; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome Back</h2>
    <form>
      <input type="email" placeholder="Email Address" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p class="note">Don't have an account? <a href="signup.html">Sign Up here</a></p>
    <p class="note"><a href="index.html">← Back to Home</a></p>
  </div>
</body>
</html>
